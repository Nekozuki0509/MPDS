apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

base.archivesName = "mpds-${archive_version}"

loom {
    splitEnvironmentSourceSets()
    mods {
        "mpds" { sourceSet sourceSets.main }
    }
}

fabricApi {
    configureDataGeneration { client = true }
}

sourceSets {
    main {
        resources {
            srcDirs += rootProject.file('templates')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation include(project(':common'))
}

def resVersion = project.version
def resMcVersion = project.property("archive_version")
def resLoaderVersion = project.property("loader_version")

processResources {
    inputs.property "version", resVersion
    inputs.property "minecraft_version", resMcVersion
    inputs.property "loader_version", resLoaderVersion

    filesMatching("fabric.mod.json") {
        expand(
                version: resVersion,
                minecraft_version: resMcVersion,
                loader_version: resLoaderVersion
        )
    }
    filteringCharset "UTF-8"
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

tasks.named('remapJar') {
    destinationDirectory = rootProject.file('dist')
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}