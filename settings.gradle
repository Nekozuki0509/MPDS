pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'MPDS'

include 'common'

file('versions').eachDir { dir ->
    include "versions:${dir.name}"
}